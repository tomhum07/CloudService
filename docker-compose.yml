services:
  db:
    image: postgres:15-alpine
    container_name: cloudservice-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=CloudService@SecuredPass123
      - POSTGRES_DB=CloudServiceDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d CloudServiceDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: cloudservice-api
    container_name: cloudservice-api-container
    build:
      context: ./Back-End
      dockerfile: CloudService.WebApi/Dockerfile
    ports:
      - "5074:8080"
      - "7108:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=CloudServiceDb;Username=postgres;Password=CloudService@SecuredPass123;
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
