name: Continuous Integration

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-ci:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Back-End/CloudService.slnx || dotnet restore Back-End/CloudService.WebApi/CloudService.WebApi.csproj

    - name: Build Backend
      run: dotnet build Back-End/CloudService.slnx --configuration Release || dotnet build Back-End/CloudService.WebApi/CloudService.WebApi.csproj --configuration Release

    - name: Run Unit Tests
      run: dotnet test Back-End/CloudService.UnitTests/CloudService.UnitTests.csproj --configuration Release --no-build

  frontend-ci:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front-end
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile

    - name: Build Frontend
      run: pnpm build
