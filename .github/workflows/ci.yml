name: .NET Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Back-End/CloudService.WebApi/CloudService.WebApi.csproj

    - name: Build
      run: dotnet build Back-End/CloudService.WebApi/CloudService.WebApi.csproj --no-restore -c Release

    - name: Run Unit Tests
      run: dotnet test Back-End/CloudService.UnitTests/CloudService.UnitTests.csproj --no-build -c Release
