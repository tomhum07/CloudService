name: Continuous Integration

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-ci:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Back-End/CloudService.slnx || dotnet restore Back-End/CloudService.WebApi/CloudService.WebApi.csproj

    - name: Build Backend
      run: dotnet build Back-End/CloudService.slnx --configuration Release || dotnet build Back-End/CloudService.WebApi/CloudService.WebApi.csproj --configuration Release

    - name: Run Unit Tests
      run: dotnet test Back-End/CloudService.UnitTests/CloudService.UnitTests.csproj --configuration Release --no-build

  frontend-ci:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front-end
    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: 'front-end/pnpm-lock.yaml'

    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile

    - name: Build Frontend
      run: pnpm build

  docker-compose-ci:
    name: Docker & Docker Compose Verification
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Validate Docker Compose Configuration
      run: docker compose config

    - name: Build and Start Services with Docker Compose
      run: docker compose up --build -d

    - name: Verify Container Health & Status
      run: |
        sleep 15
        docker compose ps
        docker compose logs api

    - name: Graceful Shutdown
      run: docker compose down -v
