name: .NET Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Back-End/CloudService.WebApi/CloudService.WebApi.csproj

    - name: Build
      run: dotnet build Back-End/CloudService.WebApi/CloudService.WebApi.csproj --no-restore -c Release

    - name: Run Unit Tests
      run: dotnet test Back-End/CloudService.UnitTests/CloudService.UnitTests.csproj --no-build -c Release

    - name: Publish Web App
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: dotnet publish Back-End/CloudService.WebApi/CloudService.WebApi.csproj -c Release -o ${{ github.workspace }}/publish

    - name: Deploy to Azure Web App
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'CloudServices'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ${{ github.workspace }}/publish

