<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký Affiliate — NovaService</title><link rel="stylesheet" href="/styles.css"></head><body><header class="shell nav"><a class="brand" href="/"><span class="logo">N</span>NovaService</a><nav class="links"><a href="/">Trang chủ</a><a href="/admin">Quản trị</a><a class="btn primary" href="#form">Đăng ký đối tác</a></nav></header><main><div class="shell page-title"><span class="eyebrow">CHƯƠNG TRÌNH ĐỐI TÁC</span><h1>Cùng hợp tác, cùng phát triển</h1><p>Giới thiệu dịch vụ phù hợp đến cộng đồng của bạn và nhận chính sách hoa hồng hấp dẫn.</p></div><div class="shell"><form class="form-card" id="affiliate-form"><h2 id="form">Thông tin đăng ký Affiliate</h2><div class="grid-2"><div class="field"><label>Họ và tên *</label><input name="fullName" required placeholder="Nguyễn Văn A"></div><div class="field"><label>Số điện thoại *</label><input name="phone" required placeholder="09xx xxx xxx"></div><div class="field"><label>Email *</label><input name="email" type="email" required placeholder="email@example.com"></div><div class="field"><label>Kênh hoạt động chính *</label><select name="channel" required><option value="">Chọn kênh</option><option>Facebook</option><option>TikTok</option><option>YouTube</option><option>Website/Blog</option><option>Khác</option></select></div></div><div class="field"><label>Kinh nghiệm Affiliate</label><input name="experience" placeholder="Ví dụ: 1 năm trong lĩnh vực công nghệ"></div><div class="field"><label>Lời giới thiệu</label><textarea name="message" placeholder="Chia sẻ về cộng đồng và mong muốn hợp tác..."></textarea></div><button class="btn primary" type="submit" data-label="Gửi đăng ký đối tác">Gửi đăng ký đối tác</button><div id="message" class="message"></div></form></div></main><footer><div class="shell">© 2026 NovaService. Chương trình Affiliate Partner.</div></footer><script src="/common.js"></script><
